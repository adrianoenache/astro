	// Initialize theme based on local storage or system preference
	const theme = (() => {
		// Check local storage for theme preference
		const localStorageTheme = localStorage?.getItem("theme") ?? "";
		// If local storage has a valid theme, use it
		if (["dark", "light"].includes(localStorageTheme)) {
			return localStorageTheme;
		}
		// Otherwise, check system preference
		if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
			return "dark";
		}
		// Default to light theme if no preference is found
		return "light";
	})();
	// Apply the initial theme to the document
	if (theme === "light") {
		// Remove the dark class if the theme is light
		document.documentElement.classList.remove("dark");
	} else {
		// Add the dark class if the theme is dark
		document.documentElement.classList.add("dark");
	}
	// Store the initial theme in local storage
	window.localStorage.setItem("theme", theme);
	// Handle theme toggle click event
	const handleToggleClick = () => {
		// Toggle the dark class on the document element
		const element = document.documentElement;
		element.classList.toggle("dark");
		// Determine the current theme after toggling
		const isDark = element.classList.contains("dark");
		localStorage.setItem("theme", isDark ? "dark" : "light");
	};
	// Attach the click event listener to the theme toggle button
	document
		.getElementById("themeToggle")
		?.addEventListener("click", handleToggleClick);
